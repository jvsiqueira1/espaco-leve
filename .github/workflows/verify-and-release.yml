name: Verify and Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and safety tests
        run: |
          dotnet build EspacoLeve.sln -c Release --warnaserror
          dotnet run --project tests/EspacoLeve.Tests -c Release --no-build
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 libgl1
      - name: Smoke test desktop pages (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet src/EspacoLeve.App/bin/Release/net10.0/EspacoLeve.dll --smoke-test
      - name: Smoke test desktop pages
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          & dotnet src/EspacoLeve.App/bin/Release/net10.0/EspacoLeve.dll --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'A interface não passou na verificação.' }

  plan:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: plan
        run: npm run release:plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    needs: [verify, plan]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (github.event_name == 'pull_request' || needs.plan.outputs.version != '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    # Two Apple notarization rounds (app and disk image) can take several minutes each.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # With every signing secret present, the macOS package must be Developer ID signed and notarized; with none, it stays ad hoc.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -eu
          present=; missing=
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            if [ -n "$(printenv "$name" || true)" ]; then present="$present $name"; else missing="$missing $name"; fi
          done
          if [ -z "$present" ]; then
            echo 'Secrets de assinatura macOS não cadastrados: o pacote terá assinatura ad hoc, sem notarização.'
            exit 0
          fi
          [ -z "$missing" ] || { echo "::error::Secrets de assinatura macOS incompletos; faltam:$missing"; exit 1; }
          keychain="$RUNNER_TEMP/espaco-leve-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode >"$RUNNER_TEMP/espaco-leve-certificate.p12"
          security import "$RUNNER_TEMP/espaco-leve-certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/espaco-leve-certificate.p12"
          # The exported .p12 usually lacks the intermediate certificate that completes the Developer ID chain; it may already be present.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/espaco-leve-developer-id-ca.cer"
          security import "$RUNNER_TEMP/espaco-leve-developer-id-ca.cer" -k "$keychain" >/dev/null 2>&1 || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')"
          [ -n "$identity" ] || { echo '::error::O certificado cadastrado não é uma identidade Developer ID Application válida.'; exit 1; }
          key="$RUNNER_TEMP/espaco-leve-notary.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode >"$key")
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "MACOS_SIGN_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY_PATH=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
            echo 'MACOS_REQUIRE_NOTARIZATION=1'
          } >>"$GITHUB_ENV"
      - name: Build versioned package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version || '0.0.0' }}
          RELEASE_RUNTIME: ${{ matrix.rid }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION -Runtime $env:RELEASE_RUNTIME
      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/espaco-leve-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/espaco-leve-notary.p8" "$RUNNER_TEMP/espaco-leve-certificate.p12" "$RUNNER_TEMP/espaco-leve-developer-id-ca.cer"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: [plan, package]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: artifacts/release
          merge-multiple: true
      - run: npm ci
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
